name: Protocol Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 3"

permissions:
  contents: read

jobs:
  recorded-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest aiohttp PyYAML
      - run: python -m pytest -q tests/test_protocol_contract.py

  optional-live-collect:
    runs-on: ubuntu-latest
    env:
      CANARY_PROFILE_URL: ${{ secrets.DOUYIN_CANARY_PROFILE_URL }}
      CANARY_STATE_B64: ${{ secrets.DOUYIN_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip when canary secrets are not configured
        if: env.CANARY_PROFILE_URL == '' || env.CANARY_STATE_B64 == ''
        run: echo "Live canary is optional; recorded contracts still ran."
      - name: Install live collector
        if: env.CANARY_PROFILE_URL != '' && env.CANARY_STATE_B64 != ''
        run: python -m pip install -e .
      - name: Restore isolated login state
        if: env.CANARY_PROFILE_URL != '' && env.CANARY_STATE_B64 != ''
        run: |
          mkdir -p runtime
          printf '%s' "$CANARY_STATE_B64" | base64 --decode > runtime/canary_state.json
      - name: Run one-item collection
        if: env.CANARY_PROFILE_URL != '' && env.CANARY_STATE_B64 != ''
        run: >-
          douyin-topic-packager collect
          --profile-url "$CANARY_PROFILE_URL"
          --top-n 1
          --scan-pages 1
          --state runtime/canary_state.json
          --output-dir /tmp/canary
